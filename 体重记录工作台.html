<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>体重记录工作台</title>
<meta name="description" content="记录体重变化，追踪减肥目标">
<meta name="theme-color" content="#6366f1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="体重记录">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #f5f7fa;
    --card: #ffffff;
    --primary: #6366f1;
    --primary-dark: #4f46e5;
    --primary-light: #e0e7ff;
    --success: #10b981;
    --warning: #f59e0b;
    --danger: #ef4444;
    --text: #1f2937;
    --text-light: #6b7280;
    --border: #e5e7eb;
    --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
    --shadow-lg: 0 10px 25px rgba(0,0,0,0.08), 0 4px 10px rgba(0,0,0,0.04);
    --radius: 14px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    min-height: -webkit-fill-available;
    padding: max(20px, env(safe-area-inset-top)) 20px 20px;
    line-height: 1.6;
  }

  .container {
    max-width: 1100px;
    margin: 0 auto;
  }

  /* 顶部标题区 */
  .header {
    background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
    color: white;
    padding: 28px 32px;
    border-radius: var(--radius);
    box-shadow: var(--shadow-lg);
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 16px;
  }
  .header h1 {
    font-size: 24px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .header .subtitle {
    font-size: 13px;
    opacity: 0.9;
    margin-top: 4px;
  }
  .header .date-now {
    background: rgba(255,255,255,0.2);
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 13px;
    backdrop-filter: blur(10px);
  }

  /* 卡片通用 */
  .card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 24px;
    margin-bottom: 20px;
  }
  .card-title {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 18px;
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--text);
  }
  .card-title .icon {
    width: 20px;
    height: 20px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: var(--primary);
  }

  /* 统计卡 */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 16px;
    margin-bottom: 20px;
  }
  .stat-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px;
    position: relative;
    overflow: hidden;
  }
  .stat-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 4px; height: 100%;
    background: var(--primary);
  }
  .stat-card.green::before { background: var(--success); }
  .stat-card.orange::before { background: var(--warning); }
  .stat-card.red::before { background: var(--danger); }
  .stat-label {
    font-size: 12px;
    color: var(--text-light);
    margin-bottom: 6px;
  }
  .stat-value {
    font-size: 26px;
    font-weight: 700;
    color: var(--text);
  }
  .stat-value .unit {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-light);
    margin-left: 3px;
  }
  .stat-sub {
    font-size: 11px;
    color: var(--text-light);
    margin-top: 4px;
  }
  .stat-sub.down { color: var(--success); }
  .stat-sub.up { color: var(--danger); }

  /* 主布局 */
  .main-grid {
    display: grid;
    grid-template-columns: 340px 1fr;
    gap: 20px;
  }
  @media (max-width: 768px) {
    .main-grid { grid-template-columns: 1fr; }
  }

  /* 表单 */
  .form-group {
    margin-bottom: 14px;
  }
  .form-group label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-light);
    margin-bottom: 6px;
  }
  .form-group input, .form-group select {
    width: 100%;
    padding: 10px 12px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    font-size: 14px;
    color: var(--text);
    background: var(--card);
    transition: border-color 0.2s, box-shadow 0.2s;
    font-family: inherit;
  }
  .form-group input:focus, .form-group select:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--primary-light);
  }
  .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .btn {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
  }
  .btn-primary {
    background: var(--primary);
    color: white;
  }
  .btn-primary:hover {
    background: var(--primary-dark);
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(99,102,241,0.3);
  }
  .btn-secondary {
    background: var(--border);
    color: var(--text);
  }
  .btn-secondary:hover { background: #d1d5db; }

  /* 目标进度 */
  .goal-section {
    background: linear-gradient(135deg, #f0fdf4 0%, #ecfdf5 100%);
    border: 1px solid #bbf7d0;
  }
  .progress-bar {
    width: 100%;
    height: 12px;
    background: #e5e7eb;
    border-radius: 6px;
    overflow: hidden;
    margin: 10px 0;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #10b981, #34d399);
    border-radius: 6px;
    transition: width 0.5s ease;
  }
  .goal-detail {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--text-light);
    margin-top: 6px;
  }

  /* 图表 */
  .chart-wrap {
    position: relative;
    height: 320px;
  }

  /* 记录列表 */
  .record-list {
    max-height: 400px;
    overflow-y: auto;
  }
  .record-list::-webkit-scrollbar { width: 6px; }
  .record-list::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }

  .record-item {
    display: flex;
    align-items: center;
    padding: 12px 14px;
    border-radius: 10px;
    transition: background 0.15s;
    border-bottom: 1px solid var(--border);
  }
  .record-item:hover { background: var(--bg); }
  .record-item:last-child { border-bottom: none; }

  .record-date {
    flex: 0 0 100px;
    font-size: 13px;
    color: var(--text-light);
  }
  .record-weight {
    flex: 1;
    font-size: 16px;
    font-weight: 600;
  }
  .record-weight .unit { font-size: 12px; color: var(--text-light); font-weight: 400; }
  .record-change {
    flex: 0 0 80px;
    text-align: right;
    font-size: 12px;
    font-weight: 600;
  }
  .record-change.down { color: var(--success); }
  .record-change.up { color: var(--danger); }
  .record-change.flat { color: var(--text-light); }
  .record-note {
    flex: 0 0 auto;
    max-width: 120px;
    font-size: 11px;
    color: var(--text-light);
    margin-right: 10px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .record-delete {
    flex: 0 0 auto;
    background: none;
    border: none;
    color: #d1d5db;
    cursor: pointer;
    font-size: 16px;
    padding: 4px 8px;
    border-radius: 6px;
    transition: all 0.15s;
  }
  .record-delete:hover { color: var(--danger); background: #fef2f2; }

  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-light);
    font-size: 14px;
  }
  .empty-state .emoji { font-size: 40px; display: block; margin-bottom: 10px; }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--text);
    color: white;
    padding: 12px 24px;
    border-radius: 10px;
    font-size: 14px;
    box-shadow: var(--shadow-lg);
    opacity: 0;
    transition: all 0.3s ease;
    z-index: 1000;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  .toast.success { background: var(--success); }
  .toast.error { background: var(--danger); }

  /* BMI 标签 */
  .bmi-tag {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 600;
    margin-left: 6px;
  }
  .bmi-tag.thin { background: #dbeafe; color: #2563eb; }
  .bmi-tag.normal { background: #d1fae5; color: #059669; }
  .bmi-tag.over { background: #fef3c7; color: #d97706; }
  .bmi-tag.obese { background: #fee2e2; color: #dc2626; }

  /* 分段控制 */
  .segmented {
    display: flex;
    background: var(--bg);
    border-radius: 10px;
    padding: 3px;
    margin-bottom: 16px;
  }
  .segmented button {
    flex: 1;
    padding: 8px;
    border: none;
    background: none;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-light);
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
  }
  .segmented button.active {
    background: var(--card);
    color: var(--primary);
    box-shadow: var(--shadow);
  }

  .two-col {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }

  /* 可折叠设置区 */
  .settings-summary {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px;
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.15s;
    user-select: none;
  }
  .settings-summary:hover { background: rgba(16,185,129,0.08); }
  .settings-summary .summary-icon { font-size: 22px; flex: 0 0 auto; }
  .settings-summary .summary-content { flex: 1; }
  .settings-summary .summary-title { font-size: 14px; font-weight: 600; color: var(--text); }
  .settings-summary .summary-detail { font-size: 12px; color: var(--text-light); margin-top: 2px; }
  .settings-summary .summary-arrow {
    font-size: 22px; color: var(--text-light); flex: 0 0 auto;
    transform: rotate(90deg); transition: transform 0.2s;
  }

  .settings-body { display: none; }
  .settings-body.open { display: block; }

  .collapse-btn {
    margin-left: auto;
    background: none;
    border: none;
    color: var(--text-light);
    font-size: 12px;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 6px;
    font-family: inherit;
  }
  .collapse-btn:hover { background: var(--bg); color: var(--text); }

  /* 危险区 */
  .danger-zone {
    margin-top: 18px;
    padding-top: 16px;
    border-top: 1px dashed #fca5a5;
  }
  .btn-danger {
    background: #fef2f2;
    color: var(--danger);
    border: 1.5px solid #fecaca;
  }
  .btn-danger:hover {
    background: #fee2e2;
    border-color: #fca5a5;
  }
  @media (max-width: 768px) {
    .two-col { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="container">
  <!-- 顶部 -->
  <div class="header">
    <div>
      <h1>⚖️ 体重记录工作台</h1>
      <div class="subtitle">坚持记录，看见每一克的变化</div>
    </div>
    <div class="date-now" id="todayDisplay"></div>
  </div>

  <!-- 统计卡片 -->
  <div class="stats-grid" id="statsGrid"></div>

  <!-- 主区域 -->
  <div class="main-grid">
    <!-- 左侧：表单 -->
    <div>
      <!-- 记录体重 -->
      <div class="card">
        <div class="card-title"><span class="icon">✏️</span> 记录今日体重</div>
        <div class="form-group">
          <label>日期</label>
          <input type="date" id="recordDate">
        </div>
        <div class="form-group">
          <label>体重 (斤)</label>
          <input type="number" id="recordWeight" step="0.1" min="40" max="600" placeholder="如 131">
        </div>
        <div class="form-group">
          <label>备注 (可选)</label>
          <input type="text" id="recordNote" placeholder="如 运动后 / 饭后" maxlength="30">
        </div>
        <button class="btn btn-primary" onclick="addRecord()">添加记录</button>
      </div>

      <!-- 设置（身高 / 目标 / 清空）可折叠 -->
      <div class="card goal-section">
        <!-- 折叠状态：摘要条 -->
        <div id="settingsSummary" class="settings-summary" onclick="toggleSettings(true)">
          <div class="summary-icon">⚙️</div>
          <div class="summary-content">
            <div class="summary-title">身高与目标设置</div>
            <div class="summary-detail" id="summaryDetail">未设置，点击展开</div>
          </div>
          <div class="summary-arrow">›</div>
        </div>

        <!-- 展开状态：编辑区 -->
        <div id="settingsBody" class="settings-body">
          <div class="card-title" style="margin-bottom:14px;">
            <span class="icon">⚙️</span> 身高与目标设置
            <button class="collapse-btn" onclick="toggleSettings(false)">收起 ▴</button>
          </div>
          <div class="form-group">
            <label>身高 (cm)</label>
            <input type="number" id="recordHeight" step="0.1" min="50" max="250" placeholder="如 170">
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>目标体重 (斤)</label>
              <input type="number" id="goalWeight" step="0.1" min="20" max="300" placeholder="如 120">
            </div>
            <div class="form-group">
              <label>目标日期</label>
              <input type="date" id="goalDate">
            </div>
          </div>
          <div id="goalProgressBox" style="display:none; margin-top: 14px;">
            <div class="progress-bar">
              <div class="progress-fill" id="goalProgressFill"></div>
            </div>
            <div class="goal-detail" id="goalDetail"></div>
          </div>
          <button class="btn btn-primary" onclick="saveSettings()" style="margin-top:10px;">保存设置</button>

          <div class="danger-zone">
            <button class="btn btn-danger" onclick="clearAllData()">🗑 一键清空所有体重记录</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 右侧：图表 + 列表 -->
    <div>
      <div class="card">
        <div class="segmented">
          <button class="active" data-range="7" onclick="switchRange(7)">近7天</button>
          <button data-range="30" onclick="switchRange(30)">近30天</button>
          <button data-range="90" onclick="switchRange(90)">近90天</button>
          <button data-range="all" onclick="switchRange('all')">全部</button>
        </div>
        <div class="chart-wrap">
          <canvas id="weightChart"></canvas>
        </div>
      </div>

      <div class="two-col">
        <div class="card">
          <div class="card-title"><span class="icon">📋</span> 记录列表</div>
          <div class="record-list" id="recordList"></div>
        </div>

        <div class="card">
          <div class="card-title"><span class="icon">💡</span> 健康提示</div>
          <div id="healthTips" style="font-size:13px; color:var(--text-light); line-height:1.8;"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const STORAGE_KEY = 'weight_records_v2';
const GOAL_KEY = 'weight_goal_v2';
const PROFILE_KEY = 'weight_profile_v2';

let records = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
let goal = JSON.parse(localStorage.getItem(GOAL_KEY) || '{}');
let profile = JSON.parse(localStorage.getItem(PROFILE_KEY) || '{}');
let currentRange = 7;
let chart = null;

// 初始化
function init() {
  // 今天日期
  const today = new Date();
  document.getElementById('todayDisplay').textContent = '📅 ' + formatDate(today);
  document.getElementById('recordDate').value = toDateInput(today);

  // 默认目标日期：3个月后
  if (!goal.date) {
    const d = new Date();
    d.setMonth(d.getMonth() + 3);
    document.getElementById('goalDate').value = toDateInput(d);
  }

  // 恢复身高
  if (profile.height) document.getElementById('recordHeight').value = profile.height;
  // 恢复目标
  if (goal.weight) document.getElementById('goalWeight').value = goal.weight;
  if (goal.date) document.getElementById('goalDate').value = goal.date;

  // 初始折叠状态：已设置过身高或目标则折叠，否则展开
  updateSettingsSummary();
  toggleSettings(!(profile.height || goal.weight));

  renderAll();
}

function formatDate(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function toDateInput(d) { return formatDate(d); }

function parseDate(s) { return new Date(s + 'T00:00:00'); }

// Toast
function toast(msg, type='') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + type;
  setTimeout(() => t.className = 'toast', 2200);
}

// 添加记录
function addRecord() {
  const date = document.getElementById('recordDate').value;
  const weight = parseFloat(document.getElementById('recordWeight').value);
  const note = document.getElementById('recordNote').value.trim();

  if (!date) { toast('请选择日期', 'error'); return; }
  if (!weight || weight < 40 || weight > 600) { toast('请输入有效体重 (40-600斤)', 'error'); return; }

  // 同日期则更新
  const idx = records.findIndex(r => r.date === date);
  const newRecord = { date, weight, note, ts: Date.now() };
  if (idx >= 0) {
    records[idx] = newRecord;
    toast('已更新当日记录', 'success');
  } else {
    records.push(newRecord);
    toast('记录成功！', 'success');
  }

  records.sort((a,b) => a.date.localeCompare(b.date));
  localStorage.setItem(STORAGE_KEY, JSON.stringify(records));

  document.getElementById('recordWeight').value = '';
  document.getElementById('recordNote').value = '';
  renderAll();
}

// 保存设置（身高 + 目标）
function saveSettings() {
  const height = parseFloat(document.getElementById('recordHeight').value);
  const weight = parseFloat(document.getElementById('goalWeight').value);
  const date = document.getElementById('goalDate').value;

  if (height && (height < 50 || height > 250)) { toast('请输入有效身高 (50-250cm)', 'error'); return; }
  if (height) {
    profile.height = height;
    localStorage.setItem(PROFILE_KEY, JSON.stringify(profile));
  }
  if (weight) {
    if (weight < 40 || weight > 600) { toast('请输入有效目标体重', 'error'); return; }
    goal = { weight, date };
    localStorage.setItem(GOAL_KEY, JSON.stringify(goal));
  }

  toast('设置已保存', 'success');
  updateSettingsSummary();
  renderAll();
  // 保存后自动折叠
  if (profile.height || goal.weight) toggleSettings(false);
}

// 折叠/展开设置区
function toggleSettings(open) {
  const body = document.getElementById('settingsBody');
  const summary = document.getElementById('settingsSummary');
  if (open) {
    body.classList.add('open');
    summary.style.display = 'none';
  } else {
    body.classList.remove('open');
    summary.style.display = 'flex';
  }
}

// 更新设置摘要
function updateSettingsSummary() {
  const parts = [];
  if (profile.height) parts.push(`身高 ${profile.height}cm`);
  if (goal.weight) parts.push(`目标 ${goal.weight.toFixed(1)}斤`);
  if (goal.date) {
    const d = parseDate(goal.date);
    parts.push(`${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`);
  }
  document.getElementById('summaryDetail').textContent = parts.length ? parts.join(' · ') : '未设置，点击展开';
}

// 一键清空所有体重记录
function clearAllData() {
  if (records.length === 0) { toast('暂无记录可清空', 'error'); return; }
  const sure = confirm(`确定清空全部 ${records.length} 条体重记录吗？\n\n此操作不可恢复，身高和目标设置会保留。`);
  if (!sure) return;
  const reallySure = confirm('再次确认：真的要删除所有体重记录吗？');
  if (!reallySure) return;
  records = [];
  localStorage.removeItem(STORAGE_KEY);
  toast('已清空所有记录', 'success');
  renderAll();
}

// 删除记录
function deleteRecord(date) {
  if (!confirm('确定删除这条记录吗？')) return;
  records = records.filter(r => r.date !== date);
  localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
  toast('已删除', 'success');
  renderAll();
}

// 计算统计
function getStats() {
  if (records.length === 0) return null;
  const sorted = [...records].sort((a,b) => a.date.localeCompare(b.date));
  const latest = sorted[sorted.length-1];
  const first = sorted[0];
  const prev = sorted.length >= 2 ? sorted[sorted.length-2] : null;

  // 总变化
  const totalChange = latest.weight - first.weight;
  // 较上次
  const lastChange = prev ? latest.weight - prev.weight : 0;

  // 平均
  const avg = sorted.reduce((s,r) => s+r.weight, 0) / sorted.length;

  // 最低/最高
  const weights = sorted.map(r => r.weight);
  const minW = Math.min(...weights);
  const maxW = Math.max(...weights);

  // BMI
  let bmi = null, bmiTag = '';
  if (profile.height) {
    const h = profile.height / 100;
    bmi = (latest.weight / 2 / (h*h)).toFixed(1);
    if (bmi < 18.5) bmiTag = 'thin';
    else if (bmi < 24) bmiTag = 'normal';
    else if (bmi < 28) bmiTag = 'over';
    else bmiTag = 'obese';
  }

  return { latest, first, prev, totalChange, lastChange, avg, minW, maxW, bmi, bmiTag };
}

// 渲染统计卡
function renderStats() {
  const grid = document.getElementById('statsGrid');
  const s = getStats();

  if (!s) {
    grid.innerHTML = `
      <div class="stat-card">
        <div class="stat-label">当前体重</div>
        <div class="stat-value">--<span class="unit">斤</span></div>
        <div class="stat-sub">暂无记录，先添加一条吧</div>
      </div>`;
    return;
  }

  const changeText = (c) => c === 0 ? '持平' : (c > 0 ? `↑ ${Math.abs(c).toFixed(1)} 斤` : `↓ ${Math.abs(c).toFixed(1)} 斤`);
  const changeClass = (c) => c === 0 ? '' : (c > 0 ? 'up' : 'down');

  let bmiHtml = '';
  if (s.bmi) {
    const tagText = {thin:'偏瘦', normal:'正常', over:'偏胖', obese:'肥胖'};
    bmiHtml = `<span class="bmi-tag ${s.bmiTag}">BMI ${s.bmi} · ${tagText[s.bmiTag]}</span>`;
  }

  grid.innerHTML = `
    <div class="stat-card">
      <div class="stat-label">当前体重</div>
      <div class="stat-value">${s.latest.weight.toFixed(1)}<span class="unit">斤</span></div>
      <div class="stat-sub ${changeClass(s.lastChange)}">${s.prev ? '较上次 ' + changeText(s.lastChange) : '首次记录'} ${bmiHtml}</div>
    </div>
    <div class="stat-card green">
      <div class="stat-label">起始体重</div>
      <div class="stat-value">${s.first.weight.toFixed(1)}<span class="unit">斤</span></div>
      <div class="stat-sub">${formatDate(parseDate(s.first.date))}</div>
    </div>
    <div class="stat-card ${s.totalChange > 0 ? 'red' : 'green'}">
      <div class="stat-label">累计变化</div>
      <div class="stat-value">${s.totalChange > 0 ? '+' : ''}${s.totalChange.toFixed(1)}<span class="unit">斤</span></div>
      <div class="stat-sub ${changeClass(s.totalChange)}">${changeText(s.totalChange)}</div>
    </div>
    <div class="stat-card orange">
      <div class="stat-label">目标体重</div>
      <div class="stat-value">${goal.weight ? goal.weight.toFixed(1) : '--'}<span class="unit">斤</span></div>
      <div class="stat-sub">${goal.weight ? `还差 ${Math.abs(s.latest.weight - goal.weight).toFixed(1)} 斤` : '未设置目标'}</div>
    </div>
  `;
}

// 渲染目标进度
function renderGoal() {
  const box = document.getElementById('goalProgressBox');
  if (!goal.weight || records.length === 0) { box.style.display = 'none'; return; }

  const s = getStats();
  const startW = s.first.weight;
  const currentW = s.latest.weight;
  const targetW = goal.weight;

  // 进度：从起点到目标完成了多少
  const totalDist = Math.abs(startW - targetW);
  const doneDist = Math.abs(startW - currentW);
  let progress = totalDist > 0 ? (doneDist / totalDist) * 100 : 100;

  // 如果反向（该减重却增重），则进度可能为负或超过
  const isLosing = targetW < startW;
  const onTrack = isLosing ? currentW <= startW : currentW >= startW;
  if (!onTrack) progress = Math.max(0, Math.min(100, progress));

  progress = Math.max(0, Math.min(100, progress));

  box.style.display = 'block';
  document.getElementById('goalProgressFill').style.width = progress + '%';

  const remain = Math.abs(currentW - targetW).toFixed(1);
  let daysLeft = '';
  if (goal.date) {
    const today = new Date(); today.setHours(0,0,0,0);
    const target = parseDate(goal.date);
    const diff = Math.ceil((target - today) / (1000*60*60*24));
    daysLeft = diff > 0 ? `剩余 ${diff} 天` : (diff === 0 ? '就是今天' : `已过期 ${-diff} 天`);
  }

  document.getElementById('goalDetail').innerHTML = `
    <span>完成 ${progress.toFixed(0)}%</span>
    <span>还需 ${remain} 斤 · ${daysLeft}</span>
  `;
}

// 渲染图表
function renderChart() {
  const ctx = document.getElementById('weightChart').getContext('2d');
  let data = [...records].sort((a,b) => a.date.localeCompare(b.date));

  // 范围筛选
  if (currentRange !== 'all') {
    const cutoff = new Date();
    cutoff.setDate(cutoff.getDate() - currentRange);
    data = data.filter(r => parseDate(r.date) >= cutoff);
  }

  if (chart) chart.destroy();

  if (data.length === 0) {
    ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
    ctx.font = '14px sans-serif';
    ctx.fillStyle = '#9ca3af';
    ctx.textAlign = 'center';
    ctx.fillText('该时间段暂无数据', ctx.canvas.width/2, 160);
    return;
  }

  const labels = data.map(r => {
    const d = parseDate(r.date);
    return `${d.getMonth()+1}/${d.getDate()}`;
  });
  const weights = data.map(r => r.weight);

  // 目标线
  const goalLine = goal.weight ? new Array(data.length).fill(goal.weight) : null;

  const datasets = [{
    label: '体重 (斤)',
    data: weights,
    borderColor: '#6366f1',
    backgroundColor: 'rgba(99,102,241,0.1)',
    fill: true,
    tension: 0.35,
    pointRadius: 4,
    pointHoverRadius: 6,
    pointBackgroundColor: '#6366f1',
    pointBorderColor: '#fff',
    pointBorderWidth: 2,
    borderWidth: 2.5,
  }];
  if (goalLine) {
    datasets.push({
      label: '目标',
      data: goalLine,
      borderColor: '#10b981',
      borderDash: [6, 4],
      fill: false,
      pointRadius: 0,
      borderWidth: 1.5,
    });
  }

  chart = new Chart(ctx, {
    type: 'line',
    data: { labels, datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: {
          display: true,
          position: 'top',
          labels: { font: { size: 12 }, usePointColors: false, boxWidth: 14 }
        },
        tooltip: {
          backgroundColor: 'rgba(31,41,55,0.95)',
          padding: 12,
          borderRadius: 8,
          titleFont: { size: 13 },
          bodyFont: { size: 13 },
          callbacks: {
            title: (items) => data[items[0].dataIndex].date,
            label: (item) => `${item.dataset.label}: ${item.parsed.y.toFixed(1)} 斤`
          }
        }
      },
      scales: {
        y: {
          beginAtZero: false,
          grid: { color: '#f3f4f6' },
          ticks: { font: { size: 11 }, callback: v => v + '斤' }
        },
        x: {
          grid: { display: false },
          ticks: { font: { size: 11 } }
        }
      }
    }
  });
}

// 渲染记录列表
function renderList() {
  const list = document.getElementById('recordList');
  if (records.length === 0) {
    list.innerHTML = `<div class="empty-state"><span class="emoji">📝</span>还没有记录<br>添加第一条体重数据吧</div>`;
    return;
  }

  const sorted = [...records].sort((a,b) => b.date.localeCompare(a.date));
  let html = '';
  sorted.forEach((r, i) => {
    const idx = sorted.length - 1 - i; // 原始正序索引
    const prev = idx > 0 ? sorted[idx-1] : null;
    let change = '';
    if (prev) {
      const diff = r.weight - prev.weight;
      const cls = diff === 0 ? 'flat' : (diff > 0 ? 'up' : 'down');
      const sign = diff > 0 ? '+' : '';
      change = `<span class="record-change ${cls}">${sign}${diff.toFixed(1)}</span>`;
    } else {
      change = `<span class="record-change flat">--</span>`;
    }

    const d = parseDate(r.date);
    const dateStr = `${d.getMonth()+1}/${d.getDate()}`;

    html += `
      <div class="record-item">
        <div class="record-date">${dateStr}</div>
        <div class="record-weight">${r.weight.toFixed(1)}<span class="unit"> 斤</span></div>
        <div class="record-note">${r.note || ''}</div>
        ${change}
        <button class="record-delete" onclick="deleteRecord('${r.date}')" title="删除">✕</button>
      </div>
    `;
  });
  list.innerHTML = html;
}

// 渲染健康提示
function renderTips() {
  const box = document.getElementById('healthTips');
  const s = getStats();

  if (!s) {
    box.innerHTML = '添加第一条记录后，这里会显示专属健康建议。';
    return;
  }

  const tips = [];
  const tagText = {thin:'偏瘦', normal:'正常', over:'偏胖', obese:'肥胖'};

  // BMI 提示
  if (s.bmi) {
    if (s.bmiTag === 'normal') tips.push('✅ BMI 处于正常范围，保持下去');
    else if (s.bmiTag === 'thin') tips.push('⚠️ BMI 偏低，注意营养均衡');
    else if (s.bmiTag === 'over') tips.push('⚠️ BMI 偏高，建议控制饮食 + 增加运动');
    else tips.push('⚠️ BMI 超标，建议咨询专业人士制定计划');
  }

  // 趋势提示
  if (records.length >= 2) {
    if (goal.weight) {
      if (s.latest.weight > goal.weight && s.totalChange < 0) {
        tips.push('📉 体重在下降，方向正确，继续加油');
      } else if (s.totalChange > 0) {
        tips.push('📈 体重有上升趋势，留意近期饮食');
      } else if (Math.abs(s.latest.weight - goal.weight) < 1) {
        tips.push('🎉 即将达成目标，再坚持一下');
      }
    } else {
      tips.push('💡 设置目标体重，获得更有针对性的建议');
    }
  }

  // 频率提示
  if (records.length >= 2) {
    const sorted = [...records].sort((a,b) => a.date.localeCompare(b.date));
    const last = parseDate(sorted[sorted.length-1].date);
    const today = new Date(); today.setHours(0,0,0,0);
    const gap = Math.floor((today - last) / (1000*60*60*24));
    if (gap > 7) tips.push(`⏰ 已 ${gap} 天未记录，建议每天固定时间称重`);
    else tips.push('📅 建议每天早晨空腹称重，数据更准确');
  }

  // 通用建议
  tips.push('💧 每日饮水 1500-2000ml');
  tips.push('🏃 每周至少 150 分钟中等强度运动');
  tips.push('😴 保证 7-8 小时睡眠，有助代谢');

  box.innerHTML = tips.map(t => `<div style="margin-bottom:8px;">${t}</div>`).join('');
}

function switchRange(r) {
  currentRange = r;
  document.querySelectorAll('.segmented button').forEach(b => {
    b.classList.toggle('active', (b.dataset.range == r) || (r==='all' && b.dataset.range==='all'));
  });
  renderChart();
}

function renderAll() {
  renderStats();
  renderGoal();
  renderChart();
  renderList();
  renderTips();
}

// 回车提交
document.getElementById('recordWeight').addEventListener('keydown', e => {
  if (e.key === 'Enter') addRecord();
});

  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js')
      .then(reg => console.log('SW 注册成功:', reg.scope))
      .catch(err => console.log('SW 注册失败:', err));
  });
}
